name: Publish Android APK Release

on:
  workflow_run:
    workflows:
      - Build Rasem Android APK
    types:
      - completed
    branches:
      - main
      - fix/capacitor-save-module-resolution
      - fix/android-save-style-reference

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: Rasem-Vector-Simple-APK
          path: release-files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          APK_PATH="$(find release-files -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          if [ "$HEAD_BRANCH" = "main" ]; then
            TAG="v1.0.1"
            TITLE="رسام الخط العربي 1.0.1"
          else
            TAG="rasem-android-build-${RUN_NUMBER}"
            TITLE="رسام الخط العربي - Android APK #${RUN_NUMBER}"
          fi
          cp "$APK_PATH" "Rasem-Vector-Artist.apk"
          gh release create "$TAG" "Rasem-Vector-Artist.apk" \
            --title "$TITLE" \
            --notes "نسخة Android مستقلة. مبنية من commit ${COMMIT_SHA}."
