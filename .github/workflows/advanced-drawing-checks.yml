name: Advanced drawing checks

on:
  push:
    branches:
      - feature/advanced-drawing-tools
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Shape recognition tests
        run: npm test
      - name: Production build
        run: npm run build
