name: Build Rasem Android APK

on:
  # APK builds are manual so web-only recognition changes never create an APK.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Test shape recognition
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasem-Vector-Simple-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
